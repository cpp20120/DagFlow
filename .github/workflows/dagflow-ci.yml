
name: DagFlow CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: dagflow-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  linux:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, static-release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build libtbb-dev

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Test
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error

      - name: Install and compile package consumer
        if: matrix.preset == 'release' || matrix.preset == 'static-release'
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/dagflow-install"
          consumer_build="$RUNNER_TEMP/dagflow-consumer"
          cmake --install "out/build/${{ matrix.preset }}" --prefix "$install_root"
          variant=preferred
          if [ "${{ matrix.preset }}" = "static-release" ]; then variant=static; fi
          cmake -S tests/install_consumer -B "$consumer_build" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$install_root" \
            -DDAGFLOW_CONSUMER_VARIANT="$variant"
          cmake --build "$consumer_build" --parallel 2
          LD_LIBRARY_PATH="$install_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$consumer_build/dagflow_install_consumer"

  benchmarks:
    name: Linux / benchmark-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build libtbb-dev

      - name: Configure
        run: cmake --preset bench-check -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON

      - name: Build benchmark and correctness targets
        run: cmake --build --preset bench-check --parallel 2

      - name: Run benchmark smoke and correctness tests
        run: ctest --preset bench-check --output-on-failure --no-tests=error

  sanitizers:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [check-asan, check-tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build libtbb-dev

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error

  fuzz:
    name: Linux / fuzz layers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install fuzz toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Configure
        run: cmake --preset fuzz

      - name: Build instrumented runtime and harnesses
        run: cmake --build --preset fuzz --parallel 2

      - name: Replay seed corpora
        run: ctest --preset fuzz --no-tests=error

      - name: Bounded mutation checks
        run: |
          for layer in containers function queues scope pool graph parking lifecycle accounting scheduler credits allocation exceptions ranges graph_scope joins saturation scope_races; do
            seed_count=$(find "out/build/fuzz/dagflow_fuzz_${layer}-corpus" -maxdepth 1 -type f | wc -l)
            "out/build/fuzz/dagflow_fuzz_${layer}" \
              "out/build/fuzz/dagflow_fuzz_${layer}-corpus" \
              "-artifact_prefix=out/build/fuzz/dagflow_fuzz_${layer}-artifacts/" \
              "-runs=$((seed_count + 201))" -max_len=4096 -timeout=15
          done

      - name: Preserve fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: out/build/fuzz/*-artifacts/

  portability:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
            cmake_args: -A x64
          - os: macos-26
            shell: zsh -e {0}
            cmake_args: -G Ninja
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Print Apple toolchain
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun clang++ --version
          xcrun --show-sdk-path

      - name: Configure
        run: >-
          cmake -S . -B build/portability ${{ matrix.cmake_args }}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DDAGFLOW_BUILD_SHARED=ON -DDAGFLOW_BUILD_STATIC=OFF
          -DDAGFLOW_BUILD_EXAMPLES=OFF -DDAGFLOW_BUILD_TESTS=ON
          -DDAGFLOW_BUILD_RUNTIME_BENCH=OFF -DDAGFLOW_BUILD_RUNTIME_SUITE=OFF
          -DDAGFLOW_BUILD_PUBLIC_API_BENCH=OFF -DDAGFLOW_BUILD_FUNCTION_BENCH=OFF
          -DDAGFLOW_BUILD_STRESS_BENCH=OFF -DDAGFLOW_BUILD_BENCH=OFF
          -DDAGFLOW_BUILD_GITHUB_BENCH=OFF -DDAGFLOW_ALLOCATOR=system
          -DDAGFLOW_INSTALL=OFF -DBOILERPLATE_COMPILER_CACHE=none

      - name: Build
        run: cmake --build build/portability --config RelWithDebInfo --parallel 2

      - name: Test
        run: ctest --test-dir build/portability -C RelWithDebInfo --output-on-failure --no-tests=error