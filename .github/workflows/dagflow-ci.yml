
name: DagFlow CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: dagflow-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  setup-entry:
    name: Setup / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash host setup and entry points
        if: runner.os != 'Windows'
        run: |
          bash scripts/test-setup-host.sh
          bash scripts/test-entry.sh

      - name: Check PowerShell host setup and entry points
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-setup-host.ps1
          ./scripts/test-entry.ps1

      - name: Prepare, build, test and run (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash setup.sh --run --jobs 2

      - name: Prepare, build, test and run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup.ps1 -Run -Jobs 2

      - name: Verify setup reuses installed tools (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          bash setup.sh --setup-only > setup-repeat.log
          cat setup-repeat.log
          grep -q 'installed=0 missing=0' setup-repeat.log
          if grep -Eq '^\+ (sudo |apt-get |dnf |pacman |brew |curl )' setup-repeat.log; then exit 1; fi

      - name: Verify setup reuses installed tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = ./setup.ps1 -SetupOnly 6>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $log -join "`n"
          Write-Host $text
          if ($text -notmatch 'installed=0 missing=0' -or $text -match '\+ winget ') { throw 'Repeated setup installed tools' }

      - name: Build a library archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash build.sh --package-format TGZ --no-tests --jobs 2

      - name: Build a library archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -PackageFormat ZIP -NoTests -Jobs 2

  linux:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, static-release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Test
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error

      - name: Install and compile package consumer
        if: matrix.preset == 'release' || matrix.preset == 'static-release'
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/dagflow-install"
          consumer_build="$RUNNER_TEMP/dagflow-consumer"
          cmake --install "out/build/${{ matrix.preset }}" --prefix "$install_root"
          variant=preferred
          if [ "${{ matrix.preset }}" = "static-release" ]; then variant=static; fi
          cmake -S tests/install_consumer -B "$consumer_build" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$install_root" \
            -DDAGFLOW_CONSUMER_VARIANT="$variant"
          cmake --build "$consumer_build" --parallel 2
          LD_LIBRARY_PATH="$install_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$consumer_build/dagflow_install_consumer"

  sanitizers:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [check-asan, check-tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error

  fuzz:
    name: Linux / fuzz layers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install fuzz toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Configure
        run: cmake --preset fuzz

      - name: Build instrumented runtime and harnesses
        run: cmake --build --preset fuzz --parallel 2

      - name: Replay seed corpora
        run: ctest --preset fuzz --no-tests=error

      - name: Bounded mutation checks
        run: |
          for layer in containers function queues scope pool graph parking lifecycle accounting scheduler credits allocation exceptions ranges graph_scope joins saturation scope_races; do
            seed_count=$(find "out/build/fuzz/dagflow_fuzz_${layer}-corpus" -maxdepth 1 -type f | wc -l)
            "out/build/fuzz/dagflow_fuzz_${layer}" \
              "out/build/fuzz/dagflow_fuzz_${layer}-corpus" \
              "-artifact_prefix=out/build/fuzz/dagflow_fuzz_${layer}-artifacts/" \
              "-runs=$((seed_count + 201))" -max_len=4096 -timeout=15
          done

      - name: Preserve fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: out/build/fuzz/*-artifacts/

  portability:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
        preset: [core, runtime-check, bench-check, mimalloc, tbbmalloc]
    steps:
      - uses: actions/checkout@v4

      # An invalid ambient root proves core/runtime never inspect vcpkg.
      # Dependency jobs ignore runner installations and bootstrap in the build tree.
      - name: Configure without any package manager
        if: matrix.preset == 'core' || matrix.preset == 'runtime-check'
        env:
          VCPKG_ROOT: /dagflow-no-vcpkg
          CMAKE_TOOLCHAIN_FILE: ''
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_DISABLE_FIND_PACKAGE_TBB=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_mimalloc=ON

      - name: Configure with automatic dependencies
        if: matrix.preset != 'core' && matrix.preset != 'runtime-check'
        env:
          VCPKG_ROOT: ''
          CMAKE_TOOLCHAIN_FILE: ''
        run: cmake --preset ${{ matrix.preset }}

      - name: Verify dependency origin
        run: >-
          cmake -DCHECK_BINARY=out/build/${{ matrix.preset }}
          -DCHECK_PRESET=${{ matrix.preset }}
          -P tests/dependency_origin_tests.cmake

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: CTest including benchmark smoke
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error

      - name: Reconfigure to verify bootstrap reuse
        if: matrix.preset == 'bench-check'
        env:
          VCPKG_ROOT: ''
          CMAKE_TOOLCHAIN_FILE: ''
        run: cmake --preset bench-check

      - name: Install core package
        if: matrix.preset == 'core'
        run: cmake --install out/build/core --config Release --prefix out/install/core

      - name: Configure package consumer
        if: matrix.preset == 'core'
        run: >-
          cmake -S tests/install_consumer -B out/build/consumer
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/install/core

      - name: Build and run package consumer
        if: matrix.preset == 'core'
        run: |
          cmake --build out/build/consumer --config Release --parallel 2
          ctest --test-dir out/build/consumer -C Release --output-on-failure --no-tests=error

      - name: Build and test embedded consumer
        if: matrix.preset == 'core'
        env:
          VCPKG_ROOT: /dagflow-no-vcpkg
        run: |
          cmake -S tests/install_consumer -B out/build/embedded -DCMAKE_BUILD_TYPE=Release -DDAGFLOW_SOURCE_DIR=${{ github.workspace }}
          cmake --build out/build/embedded --config Release --parallel 2
          ctest --test-dir out/build/embedded -C Release --output-on-failure --no-tests=error

  # The library framework already supports gcov-compatible instrumentation.
  # Keep coverage separate from sanitizers and release timing baselines.
  coverage:
    name: GCC / coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC and reporting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build lcov

      - name: Configure instrumented DagFlow
        run: cmake --preset coverage

      - name: Build instrumented tests
        run: cmake --build --preset coverage --parallel 2

      - name: Execute tests
        run: ctest --preset coverage --output-on-failure --no-tests=error

      - name: Generate HTML and LCOV report
        run: cmake --build --preset coverage --target coverage-report --parallel 2

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dagflow-coverage
          path: |
            out/build/coverage/coverage/coverage.info
            out/build/coverage/coverage/html/
          if-no-files-found: warn

  cross-aarch64:
    name: Cross / Linux AArch64 library and consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native host CMake and cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Configure and build cross library
        run: |
          cmake --preset linux-arm64
          cmake --build --preset linux-arm64 --parallel 2

      - name: Verify the artifact architecture and install
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find out/build/linux-arm64 -maxdepth 2 -name 'libdagflow*.a' -print -quit)
          test -n "$archive"
          aarch64-linux-gnu-readelf -h "$archive" > "$RUNNER_TEMP/dagflow-arm64-elf.txt"
          grep -q 'Machine:.*AArch64' "$RUNNER_TEMP/dagflow-arm64-elf.txt"
          cmake --install out/build/linux-arm64 --prefix "$RUNNER_TEMP/dagflow-arm64"

      - name: Cross-build an external package consumer
        shell: bash
        run: |
          cmake -S tests/install_consumer -B "$RUNNER_TEMP/arm64-consumer" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-aarch64.cmake" \
            -DDagFlow_DIR="$RUNNER_TEMP/dagflow-arm64/lib/cmake/DagFlow" \
            -DDAGFLOW_CONSUMER_VARIANT=static -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/arm64-consumer" --parallel 2
          aarch64-linux-gnu-readelf -h "$RUNNER_TEMP/arm64-consumer/dagflow_install_consumer" \
            | grep -q 'Machine:.*AArch64'
          # Cross-compiled binaries are not executed on the x86_64 runner.

  distribution:
    name: Package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure library-only shared + static distribution
        run: cmake --preset distribution

      - name: Compile both library variants
        run: cmake --build --preset distribution --parallel 2

      - name: Package with CPack
        run: cmake --build --preset distribution --target package --parallel 2

      - name: Install into a relocatable test prefix
        run: cmake --install out/build/distribution --config Release --prefix out/install/distribution

      - name: Configure installed static consumer
        run: >-
          cmake -S tests/install_consumer -B out/build/distribution-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/install/distribution
          -DDAGFLOW_CONSUMER_VARIANT=static

      - name: Build installed consumer
        run: cmake --build out/build/distribution-consumer --config Release --parallel 2

      - name: Run installed consumer
        run: ctest --test-dir out/build/distribution-consumer -C Release --output-on-failure --no-tests=error

      - name: Preserve downloadable distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: dagflow-package-${{ runner.os }}
          path: out/packages/distribution/*
          if-no-files-found: error

  documentation:
    name: Doxygen / public API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation generator
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - name: Configure docs-only build
        run: >-
          cmake --preset core
          -DDAGFLOW_BUILD_DOCS=ON
          -DDAGFLOW_BUILD_TESTS=OFF
          -DDAGFLOW_BUILD_EXAMPLES=OFF
      - name: Generate Doxygen documentation
        run: cmake --build --preset core --target docs --parallel 2
      - name: Preserve documentation
        uses: actions/upload-artifact@v4
        with:
          name: dagflow-api-docs
          path: out/build/core/html/
          if-no-files-found: warn
