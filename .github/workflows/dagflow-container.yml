name: DagFlow container verification
on:
  workflow_dispatch:
    inputs:
      preset:
        description: Build/test preset
        type: choice
        options: [core, runtime-check]
        default: core
permissions:
  contents: read
jobs:
  container-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute CTest in Debian SDK image
        run: bash tools/container.sh test --preset "${{ inputs.preset }}"
